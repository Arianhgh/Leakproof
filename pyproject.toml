[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ml-leakproof"
dynamic = ["version"]
description = "Leakproof: static, dataset, and runtime leakage/evaluation-rigor checks for ML workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arianhgh" }]
keywords = ["machine-learning", "data-leakage", "linter", "static-analysis", "ml-evaluation", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "nbformat>=5.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
data = [
    "pandas>=2.0",
    "numpy>=1.23",
    "scikit-learn>=1.1",
    "scipy>=1.9",
    "datasketch>=1.5",
    "imagehash>=4.3",
    "Pillow>=9.0",
]
runtime = [
    "wrapt>=1.14",
    "numpy>=1.23",
    "scikit-learn>=1.1",
]
runtime-integrations = [
    "imbalanced-learn>=0.10",
    "xgboost>=1.7",
    "lightgbm>=3.3",
]
llm = [
    "anthropic>=0.25",
    "openai>=1.0",
]
fix = ["libcst>=1.0"]
# Retained as a migration alias for 0.1 users.
cst = ["libcst>=1.0"]
dev = [
    "build>=1.2",
    "hatch>=1.14",
    "hypothesis>=6.100",
    "jsonschema>=4.20",
    "mypy>=1.8",
    "pre-commit>=3.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "twine>=5.0",
    "pandas>=2.0",
    "numpy>=1.23",
    "scikit-learn>=1.1",
    "scipy>=1.9",
    "wrapt>=1.14",
    "libcst>=1.0",
]

[project.scripts]
ml-leakproof = "ml_leakproof.cli:app"

[project.urls]
Homepage = "https://github.com/Arianhgh/Leakproof"
Documentation = "https://github.com/Arianhgh/Leakproof#readme"
Issues = "https://github.com/Arianhgh/Leakproof/issues"

[project.entry-points."ml_leakproof.rules"]
# Third-party plugins register here; built-ins are registered by the package.

[project.entry-points."ml_leakproof.adapters"]
# Third-party framework adapters register here.

[tool.hatch.version]
path = "ml_leakproof/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["ml_leakproof"]

[tool.hatch.build.targets.sdist]
include = [
    "ml_leakproof",
    "tests",
    "docs",
    "README.md",
    "SKILL.md",
    "LICENSE",
    "leakproof.toml",
    "action.yml",
    ".pre-commit-config.yaml",
]
exclude = [".leakproof-corpus", ".mypy_cache", ".pytest_cache", ".ruff_cache"]

[tool.leakproof]
select = ["ALL"]
ignore = []
fail_on = "high"
exclude = ["tests/", "examples/", ".venv/", "build/", "dist/"]
layers = ["static", "data", "runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures", ".leakproof-corpus", "build", "dist"]
addopts = "--strict-markers"
markers = [
    "integration: tests that exercise installed packages or optional integrations",
    "slow: bounded but slower corpus or large-input checks",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".leakproof-corpus", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: Typer uses Option()/Argument() as defaults by design.
ignore = ["E501", "B905", "B008"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = "(^|/)(tests|build|dist|.leakproof-corpus|ml_leakproof/examples)/"
