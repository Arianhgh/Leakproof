name: "Leakproof"
description: "Run ml-leakproof and emit SARIF for GitHub code scanning."
branding:
  icon: "shield"
  color: "purple"
inputs:
  paths:
    description: "Newline-separated files or directories to scan."
    required: false
    default: "."
  select:
    description: "Space-separated rule selectors."
    required: false
    default: ""
  fail-on:
    description: "Severity gate (critical|high|medium|low|info)."
    required: false
    default: "high"
  layers:
    description: "Layer list; check accepts static only."
    required: false
    default: "static"
  output:
    description: "SARIF output path."
    required: false
    default: "leakproof.sarif"
runs:
  using: "composite"
  steps:
    - name: Install checked-out Leakproof
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Scan
      shell: bash
      env:
        LEAKPROOF_INPUT_PATHS: ${{ inputs.paths }}
        LEAKPROOF_INPUT_SELECT: ${{ inputs.select }}
        LEAKPROOF_INPUT_FAIL_ON: ${{ inputs.fail-on }}
        LEAKPROOF_INPUT_LAYERS: ${{ inputs.layers }}
        LEAKPROOF_INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        set -u
        path_args=()
        while IFS= read -r path; do
          [ -n "$path" ] && path_args+=("$path")
        done <<< "$LEAKPROOF_INPUT_PATHS"
        select_args=()
        read -r -a selectors <<< "$LEAKPROOF_INPUT_SELECT"
        for selector in "${selectors[@]}"; do
          select_args+=(--select "$selector")
        done
        command=(ml-leakproof check "${path_args[@]}" "${select_args[@]}"
          --layers "$LEAKPROOF_INPUT_LAYERS"
          --fail-on "$LEAKPROOF_INPUT_FAIL_ON"
          --format sarif --output "$LEAKPROOF_INPUT_OUTPUT")
        status=0
        "${command[@]}" || status=$?
        exit "$status"
