name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data,runtime]"
      - name: Lint (ruff)
        run: ruff check leakproof
      - name: Type-check (mypy strict)
        run: mypy --strict leakproof || true  # advisory until annotations complete
      - name: Test
        run: pytest tests/ -q
      - name: Benchmark table
        run: python -m tests.corpus.metrics

  sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Self-scan (dogfood)
        run: leakproof check leakproof --format sarif --output leakproof.sarif --fail-on high || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: leakproof.sarif
