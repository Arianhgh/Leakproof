name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - name: Install locked development stack
        run: uv sync --locked --extra dev --extra data --extra runtime --extra llm
      - name: Ruff
        run: uv run --no-sync ruff check ml_leakproof tests/corpus scripts
      - name: Strict mypy
        run: uv run --no-sync mypy --strict ml_leakproof
      - name: Tests and full-package branch coverage
        run: |
          uv run --no-sync coverage run -m pytest -q
          uv run --no-sync coverage report
          uv run --no-sync coverage xml -o coverage.xml
      - name: Fresh fixture benchmark
        run: |
          uv run --no-sync python -m tests.corpus.metrics --json > benchmark-results.json
          uv run --no-sync python -m tests.corpus.metrics --verify benchmark-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: validation-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            benchmark-results.json

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv sync --locked --extra dev --extra data --extra runtime --extra llm
      - name: Build and validate distributions
        run: |
          uv run --no-sync python -m build
          uv run --no-sync twine check --strict dist/*.whl dist/*.tar.gz
          uv run --no-sync python scripts/smoke_distribution.py dist/*.whl
          uv run --no-sync python scripts/smoke_distribution.py dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: unpublished-distributions
          path: dist/*

  reviewed-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv sync --locked
      - name: Check reviewed cases at pinned upstream commits
        run: uv run --no-sync python -m tests.corpus.labeled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-corpus
          path: corpus-labeled-results.json

  sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Self-scan
        run: ml-leakproof check ml_leakproof --select ALL --fail-on critical --format sarif --output leakproof.sarif --allow-partial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leakproof-sarif
          path: leakproof.sarif
