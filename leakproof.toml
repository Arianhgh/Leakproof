# Example Leakproof configuration.
# Place this at your repo root, or use a [tool.leakproof] table in pyproject.toml.
# Resolution order: built-ins -> profile defaults -> project files -> CLI flags.

select = ["ALL"]                 # or explicit globs: ["P001", "C00*", "D*"]
ignore = []
fail_on = "high"                 # fail CI if any finding >= this severity
exclude = ["tests/", "examples/", ".venv/"]
layers = ["static", "data", "runtime"]

[severity]
# per-rule severity overrides
# S002 = "low"

[data]
neardup_text_threshold = 0.8
neardup_distance = 0.05
imbalance_ratio = 0.9
sample_cap = 200000
target_leakage_score = 0.98
mi_floor = 0.2
mi_dominance_ratio = 1.5
hash_chunk_size = 50000
max_examples = 10
max_neardup_candidates = 100000
max_neardup_pairs = 100000
deterministic_sampling = false
probe_cv_folds = 5

[llm]
enabled = false
# Explicit provider and model are required when enabled.
# provider = "anthropic"         # anthropic | openai | ollama
# model = "claude-model-id"
